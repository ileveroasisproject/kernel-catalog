<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Annuaire KERNEL</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
        }
        h1 {
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .link-card {
            background: #141414;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .link-card a {
            color: #58a6ff;
            font-size: 1.2em;
            text-decoration: none;
            font-weight: bold;
        }
        .link-card a:hover {
            text-decoration: underline;
        }
        .link-card p {
            color: #8b949e;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

    <h1>KΕΓNΕ𝐋 - Catalogue</h1>
    <div id="liste-liens">Chargement des données...</div>

    <script>
        async function chargerLiens() {
            try {
                // Le fichier liens.json doit se trouver au même endroit
                const reponse = await fetch('liens.json?' + new Date().getTime()); // Empêche le cache du navigateur
                const liens = await reponse.json();
                
                const conteneur = document.getElementById('liste-liens');
                conteneur.innerHTML = '';
                
                liens.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'link-card';
                    card.innerHTML = `
                        <a href="${item.url}" target="_blank">${item.titre}</a>
                        <p>${item.description}</p>
                    `;
                    conteneur.appendChild(card);
                });
            } catch (erreur) {
                document.getElementById('liste-liens').innerText = "Erreur lors du chargement des données.";
            }
        }

        // Charge les liens au démarrage
        chargerLiens();

        // Optionnel : Actualise automatiquement toutes les 10 secondes pour voir les modifs en temps réel
        setInterval(chargerLiens, 10000);
    </script>

</body>
</html>
