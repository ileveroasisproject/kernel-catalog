<body>

    <script>

            },
            {
                "titre": "darkweb market",

                "url": "http://dnrk746n2632y7gn5japydalxrusvenllrltapw743yjglpmbo2kkhqd.onion/",
                "categorie": "market"
            },
            {
                "titre": "honor gun",
                "description": "l'un des marches phare de l'armement lourd",
                "url": "http://x4fcceh6bfwxr4b54i6tgufhmut43jqqi4oeapg3oubjlrkzzm5bw5qd.onion/",
                "categorie": "market"
            },
            {
                "titre": "buy-money",
                "description": "marchée phare de contrefacon de billets en euro,usd et bien plus,verifiez les vendeurs",
                "url": "http://realrozxkkgg2vubqvxjljogwhtvpdlfimriiolw6m3fvqijohh7zaid.onion/",

            },
            {
                "titre": "dark video",
                "description": "⚠️ Avertissement : Contenu pornographique sensible, réservé à un public majeur et averti.",
                "url": "http://darks2gnbeqyhrrm45q3bpejr4yn5bdetr46u5ym2xxrz76syztyioyd.onion/",
                "categorie": "market"
            }
        ];

        function afficherLiens(categorieFiltre) {
            const conteneur = document.getElementById('liste-liens');
            conteneur.innerHTML = '';

            const liensFiltres = liens.filter(item => {
                if (categorieFiltre === 'toutes') return true;
                return item.categorie === categorieFiltre;
            });

            if (liensFiltres.length === 0) {
                conteneur.innerHTML = '<div class="link-card" style="text-align:center; color:#ff4444;">Aucun service dans cette catégorie pour le moment...</div>';
                return;
            }

            liensFiltres.forEach((item, uniqueIndex) => {
                const card = document.createElement('div');
                card.className = 'link-card';
                card.innerHTML = `
                    <span class="category-badge">${item.categorie}</span>
                    <h3>${item.titre}</h3>
                    <p>${item.description}</p>
                    <div class="url-box">
                        <input type="text" id="url-item-${uniqueIndex}" value="${item.url}" readonly>
                        <button onclick="copierLien('url-item-${uniqueIndex}', this)">Copier</button>
                    </div>
                `;
                conteneur.appendChild(card);
            });
        }

        function filtrerLiens() {
            const categorieChoisie = document.getElementById('categorie-select').value;
            afficherLiens(categorieChoisie);
        }

        function copierLien(idInput, bouton) {
            const input = document.getElementById(idInput);
            if (!input) return;
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);
            
            bouton.innerText = "Copié !";
            bouton.classList.add('copied');
            
            setTimeout(() => {
                bouton.innerText = "Copier";
                bouton.classList.remove('copied');
            }, 2000);
        }

        afficherLiens('toutes');
    </script>
