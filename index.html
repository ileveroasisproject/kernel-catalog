<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Annuaire KERNEL</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
        }
        h1 {
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .link-card {
            background: #141414;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .link-card h3 {
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .link-card p {
            color: #8b949e;
            margin: 0 0 10px 0;
        }
        .url-box {
            display: flex;
            background: #000000;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }
        .url-box input {
            background: transparent;
            border: none;
            color: #58a6ff;
            padding: 8px;
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            outline: none;
        }
        .url-box button {
            background: #21262d;
            color: #c9d1d9;
            border: none;
            border-left: 1px solid #333;
            padding: 0 15px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
        .url-box button:hover {
            background: #30363d;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>KΕΓNΕ𝐋 - Catalogue</h1>
    <div id="liste-liens">Chargement...</div>

    <script>
        async function chargerLiens() {
            try {
                const reponse = await fetch('liens.json?' + new Date().getTime());
                const liens = await reponse.json();
                
                const conteneur = document.getElementById('liste-liens');
                conteneur.innerHTML = '';
                
                liens.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'link-card';
                    card.innerHTML = `
                        <h3>${item.titre}</h3>
                        <p>${item.description}</p>
                        <div class="url-box">
                            <input type="text" id="url-${index}" value="${item.url}" readonly>
                            <button onclick="copierLien('url-${index}', this)">Copier</button>
                        </div>
                    `;
                    conteneur.appendChild(card);
                });
            } catch (erreur) {
                document.getElementById('liste-liens').innerText = "Erreur lors du chargement des données.";
            }
        }

        function copierLien(idInput, bouton) {
            const input = document.getElementById(idInput);
            input.select();
            input.setSelectionRange(0, 99999); // Pour mobiles
            navigator.clipboard.writeText(input.value);
            
            const texteOriginal = bouton.innerText;
            bouton.innerText = "Copié !";
            bouton.style.color = "#3fb950";
            setTimeout(() => {
                bouton.innerText = texteOriginal;
                bouton.style.color = "";
            }, 2000);
        }

        chargerLiens();
    </script>

</body>
</html>
